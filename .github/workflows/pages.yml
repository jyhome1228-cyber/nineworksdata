name: Deploy 9W Control to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GitHub project snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/jyhome1228-cyber/repos?per_page=100&sort=pushed&direction=desc&type=owner" \
            > data/repos.json

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/jyhome1228-cyber/events/public?per_page=30" \
            > data/events.json || echo '[]' > data/events.json

          jq -e 'type == "array"' data/repos.json >/dev/null
          jq -e 'type == "array"' data/events.json >/dev/null
          echo "snapshot repos=$(jq length data/repos.json) events=$(jq length data/events.json)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
